name: EasyConfig Bundle CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 6.4 (LTS)
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '6.4.*'

          # Symfony 7.4
          - php: '8.2'
            symfony: '7.4.*'
          - php: '8.3'
            symfony: '7.4.*'
          - php: '8.4'
            symfony: '7.4.*'
          - php: '8.5'
            symfony: '7.4.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, gd, exif, opcache, xml, dom, pcov
          coverage: pcov
          tools: composer:v2

      - name: Lock Symfony version
        run: |
          composer require symfony/framework-bundle:${{ matrix.symfony }} \
                           symfony/dependency-injection:${{ matrix.symfony }} \
                           symfony/config:${{ matrix.symfony }} \
                           symfony/http-kernel:${{ matrix.symfony }} \
                           symfony/console:${{ matrix.symfony }} \
                           --no-update

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit